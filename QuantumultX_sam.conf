; ---------- 屏蔽 iOS/iPadOS 系统更新（不需要请删除以下 4 行） ----------
host, mesu.apple.com, reject
host, gdmf.apple.com, reject
host, updates-http.cdn-apple.com, reject
host, xp.apple.com, reject

; ---------- 局域网 / 保留地址 ----------
host-suffix, local, direct
ip-cidr, 10.0.0.0/8, direct, no-resolve
ip-cidr, 100.64.0.0/10, direct, no-resolve
ip-cidr, 127.0.0.0/8, direct, no-resolve
ip-cidr, 172.16.0.0/12, direct, no-resolve
ip-cidr, 192.168.0.0/16, direct, no-resolve
ip-cidr, 224.0.0.0/4, direct, no-resolve
ip6-cidr, fe80::/10, direct, no-resolve

; ---------- 国内 IP 直连（QX 内置 GeoIP，替代 2.3 万条的 ChinaIPs 列表） ----------
geoip, cn, direct

; 以上都没命中的请求，走 final 指定的策略
final, 漏网之鱼

[rewrite_local]
// YouTube 字幕自动翻译为简体中文（依赖 MitM 解密 www.youtube.com）
https:\/\/www.youtube.com\/api\/timedtext\?.+&lang=(?!zh).+?((?!&tlang=zh\-Hans).)*$ url request-header \sHTTP/1\.1(\r\n) request-header &tlang=zh-Hans HTTP/1.1$1

[mitm]
; 需在 APP 内自行生成证书、安装并信任，然后 p12 / passphrase 会自动写入
; TestFlight 复写所需的 testflight.apple.com 由该复写自带，无需在此重复
hostname = www.youtube.com
passphrase = 
p12 =
