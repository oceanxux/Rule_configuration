; Quantumult X 配置 · 2026.09 整理版
; 以 ";" "#" "//" 开头的行为注释，去掉符号后该行才生效

[general]
; 节点可用性测试地址
server_check_url=http://cp.cloudflare.com/generate_204
; 资源解析器：仅在订阅/复写带 opt-parser=true 时使用
resource_parser_url=https://cdn.jsdelivr.net/gh/KOP-XIAO/QuantumultX@master/Scripts/resource-parser.js
; 节点页面的 IP 信息展示
geo_location_checker=http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/IP_API.js

[dns]
; QX 会并发查询所有 DNS，保留两个稳定的即可
server=223.5.5.5
server=119.29.29.29
; 指定域名走对应厂商 DNS，CDN 解析更准
server=/*.taobao.com/223.5.5.5
server=/*.tmall.com/223.5.5.5
server=/*.alipay.com/223.5.5.5
server=/*.alicdn.com/223.5.5.5
server=/*.aliyun.com/223.5.5.5
server=/*.qq.com/119.29.29.29
server=/*.tencent.com/119.29.29.29
server=/*.wechat.com/119.29.29.29

[task_local]

[policy]
; 静态策略组：手动选择。默认选中的是列表里的第一项
static=节点选择, 自动选择, 香港, 台湾, 日本, 韩国, 新加坡, 美国, proxy, direct, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Static.png
; AI 服务：OpenAI/Claude/Gemini 等不支持港澳大陆，默认放美国；没有美国节点请把 节点选择 调到最前
static=AI, 美国, 日本, 新加坡, 台湾, 韩国, 节点选择, 自动选择
static=🎬 YouTube, 节点选择, 自动选择, 香港, 台湾, 日本, 韩国, 新加坡, 美国, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png
static=Telegram, 节点选择, 自动选择, 香港, 台湾, 日本, 韩国, 新加坡, 美国, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png
static=🍎 苹果服务, direct, 节点选择, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple.png
static=漏网之鱼, 节点选择, 自动选择, 香港, 台湾, 日本, 韩国, 新加坡, 美国, direct, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Final.png

; 测速策略组：每 600 秒测速一次，新节点比当前节点快过 tolerance(ms) 才切换
; 自动选择：排除订阅里的"剩余流量/到期时间/官网"等非节点条目
url-latency-benchmark=自动选择, server-tag-regex=^((?!(剩余|流量|到期|过期|官网|套餐|重置|Expire|Traffic|Reset)).)*$, check-interval=600, tolerance=80, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Urltest.png
; 地区分组：英文缩写用前后非字母限定，避免 Network 命中 TW、Russia/Australia 命中 US
url-latency-benchmark=香港, server-tag-regex=(?i)(港|(?<![a-z])HK(?![a-z])|Hong ?Kong), check-interval=600, tolerance=80, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/HK.png
url-latency-benchmark=台湾, server-tag-regex=(?i)(台|(?<![a-z])TW(?![a-z])|Taiwan), check-interval=600, tolerance=100, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/TW.png
url-latency-benchmark=日本, server-tag-regex=(?i)(日本|东京|大阪|(?<![a-z])JP(?![a-z])|Japan|Tokyo|Osaka), check-interval=600, tolerance=100, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/JP.png
url-latency-benchmark=韩国, server-tag-regex=(?i)(韩|韓|首尔|(?<![a-z])KR(?![a-z])|Korea|Seoul), check-interval=600, tolerance=100, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/KR.png
url-latency-benchmark=新加坡, server-tag-regex=(?i)(新加坡|狮城|獅城|(?<![a-z])SG(?![a-z])|Singapore), check-interval=600, tolerance=100, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/SG.png
url-latency-benchmark=美国, server-tag-regex=(?i)(美国|美國|洛杉矶|圣何塞|西雅图|芝加哥|纽约|硅谷|(?<![a-z])USA?(?![a-z])|United ?States), check-interval=600, tolerance=100, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/US.png

; 服务器远程订阅：在这里添加你的机场订阅
[server_remote]
;https://你的订阅地址, tag=机场名称, update-interval=86400, opt-parser=true, enabled=true

[filter_remote]
; 规则匹配顺序：本地规则(filter_local) 始终先于远程规则；远程规则按下面的从上到下
; ---------- 拦截类（放最前，避免被后面的放行规则抢先命中） ----------
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/AdvertisingLite/AdvertisingLite.list, tag=🚦去广告, force-policy=reject, update-interval=86400, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Hijacking/Hijacking.list, tag=🚫运营商劫持, force-policy=reject, update-interval=172800, opt-parser=false, enabled=true

; ---------- 专用服务 ----------
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/OpenAI/OpenAI.list, tag=🎯OpenAI, force-policy=AI, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Claude/Claude.list, tag=🎯Claude, force-policy=AI, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Gemini/Gemini.list, tag=🎯Gemini, force-policy=AI, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Copilot/Copilot.list, tag=🎯Copilot, force-policy=AI, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Google/Google.list, tag=🎯Google, force-policy=节点选择, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Telegram/Telegram.list, tag=🎯Telegram, force-policy=Telegram, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/YouTube/YouTube.list, tag=🎬 YouTube, force-policy=🎬 YouTube, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Apple/Apple.list, tag=Apple服务, force-policy=🍎 苹果服务, update-interval=172800, opt-parser=false, enabled=true

; ---------- 基础分流 ----------
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/China/China.list, tag=🎯国内网站-直连, force-policy=direct, update-interval=172800, opt-parser=false, enabled=true
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/GlobalMedia/GlobalMedia.list, tag=🎯国际流媒体, force-policy=节点选择, update-interval=172800, opt-parser=false, enabled=true

; rewrite 复写远程订阅
[rewrite_remote]
https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/Function/TFDownload.conf, tag=TestFlight区域限制解除, update-interval=86400, opt-parser=false, enabled=true

