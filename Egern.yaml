#sam for Egern
# ================

http_port: 6152
socks_port: 6153
vif_only: true

hijack_dns:
  - '*:53'

geoip_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb
asn_db_url: https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-ASN.mmdb

proxy_latency_test_url: http://1.1.1.1/generate_204
direct_latency_test_url: http://www.gstatic.com/generate_204

dns:
  bootstrap:
    - system
  upstreams:
    Domestic-DNS:
      - 223.5.5.5
      - 119.29.29.29
    Domestic-Encrypted-DNS:
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    Foreign-Encrypted-DNS:
      - https://cloudflare-dns.com/dns-query
      - https://dns.google/dns-query
  forward:
    - proxy_rule_set:
        match: https://github.com/Repcz/Tool/raw/X/Egern/Rules/Reject.yaml
        value: REJECT
        disabled: false
    - proxy_rule_set:
        match: https://github.com/Repcz/Tool/raw/X/Egern/Rules/ChinaDomain.yaml
        value: Domestic-DNS
        disabled: false
    - domain_wildcard:
        match: '*'
        value: Domestic-Encrypted-DNS
        disabled: false
  hosts:
    dns.google:
      - 8.8.8.8, 8.8.4.4, 2001:4860:4860::8888, 2001:4860:4860::8844
    cloudflare-dns.com:
      - 104.16.249.249, 104.16.248.249, 2606:4700::6810:f8f9, 2606:4700::6810:f9f9
    dns.alidns.com:
      - 223.5.5.5, 223.6.6.6, 2400:3200:baba::1, 2400:3200::1
    doh.pub:
      - 1.12.12.12, 120.53.53.53
    dot.pub:
      - 1.12.12.12, 120.53.53.53
  proxy_nameservers:
    - 119.29.29.29
    - 223.5.5.5

real_ip_domains:
  - lancache.steamcontent.com
  - '*.msftconnecttest.com'
  - '*.msftncsi.com'
  - '*.srv.nintendo.net'
  - '*.stun.playstation.net'
  - xbox.*.microsoft.com
  - '*.xboxlive.com'
  - '*.logon.battlenet.com.cn'
  - '*.logon.battle.net'
  - stun.l.google.com
  - easy-login.10099.com.cn
  - '*-update.xoyocdn.com'
  - '*.prod.cloud.netflix.com'
  - appboot.netflix.com
  - '*-appboot.netflix.com'

policy_groups:

  - external:
      name: 手动选择
      type: select
      urls:
        - http://your-service-provider
      hidden: false
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png

  - auto_test:
      name: 自动优选
      policies:
        - 手动选择
      flatten: true
      interval: 60
      tolerance: 0
      timeout: 5
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png

  - select:
      name: 🇭🇰 香港
      policies:
        - 手动选择
      flatten: true
      filter: '(?i)^(?=.*(🇭🇰|香港|(\b(HK|HKG|Hong)(\d+)?\b))).*$'
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png

  - select:
      name: 🇹🇼 台湾
      policies:
        - 手动选择
      flatten: true
      filter: '(?i)^(?=.*(🇹🇼|台湾|(\b(TW|TWN|Tai|Taiwan)(\d+)?\b))).*$'
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/China.png

  - select:
      name: 🇯🇵 日本
      policies:
        - 手动选择
      flatten: true
      filter: '(?i)^(?=.*(🇯🇵|日本|川日|东京|大阪|泉日|埼玉|(\b(JP|JPN|Japan)(\d+)?\b))).*$'
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png

  - select:
      name: 🇰🇷 韩国
      policies:
        - 手动选择
      flatten: true
      filter: '(?i)^(?=.*(🇰🇷|韩国|韓|首尔|(\b(KR|KOR|Korea)(\d+)?\b))).*$'
      icon: https://raw.githubusercontent.com/Semporia/Hand-Painted-icon/master/Rounded_Rectangle/South_Korea.png

  - select:
      name: 🇸🇬 狮城
      policies:
        - 手动选择
      flatten: true
      filter: '(?i)^(?=.*(🇸🇬|新加坡|狮|(\b(SG|SGP|Singapore)(\d+)?\b))).*$'
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png

  - select:
      name: 🇺🇸 美国
      policies:
        - 手动选择
      flatten: true
      filter: '(?i)^(?=.*(🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|(\b(US|USA|United States)(\d+)?\b))).*$'
      icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png

  - select:
      name: 软媒体
